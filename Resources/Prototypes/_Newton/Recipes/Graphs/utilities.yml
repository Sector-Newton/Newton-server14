# Граф вентилятора
- type: constructionGraph
  id: DirFan
  start: start
  graph:
  - node: start
    edges:
    - to: littleDirectionalFan
      steps:
      - material: Gold
        amount: 2
        doAfter: 0.5
      - material: Steel
        amount: 10
        doAfter: 0.5

  - node: littleDirectionalFan
    entity: AtmosDeviceFanDirectional
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: IngotGold1
        amount: 2
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 10
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 2
      - tool: Screwing
        doAfter: 1

# Граф дренажа
- type: constructionGraph
  id: FloorDrainGraph
  start: start
  graph:
  - node: start
    edges:
    - to: floorDrain
      steps:
      - material: Gold
        amount: 10
        doAfter: 1
      - material: Steel
        amount: 20
        doAfter: 1

  - node: floorDrain
    entity: FloorDrain
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: IngotGold1
        amount: 10
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 10
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 3
      - tool: Screwing
        doAfter: 1

