    deconstructTileProto: DeconstructTileUpgrader
    deconstructLatticeProto: DeconstructLatticeUpgrader
    availablePrototypes:
    - WallSolidUpgrader
    - FloorSteel
    - Plating
    - Catwalk
    - GrilleUpgrader
    - WindowUpgrader
    - WindowDirectionalUpgrader
    - WindowReinforcedDirectionalUpgrader
    - ReinforcedWindowUpgrader
    - AirlockUpgrader
    - AirlockGlassUpgrader
    - FirelockUpgrader
    - TubeLightUpgrader
    - BulbLightUpgrader
    - LVCable
    - MVCable
    - HVCable
    - CableTerminal
    - DeconstructUpgrader
  - type: LimitedCharges
    maxCharges: 40

- type: entity
  id: RPDUpgraden
  parent: RPD
  name: RPD
  description: A device used to rapidly pipe things.
  components:
  - type: LimitedCharges
    maxCharges: 100

