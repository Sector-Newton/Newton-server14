# Base taken from ADT https://github.com/AdventureTimeSS14/space_station_ADT
- type: entity
  parent: AppearanceHuman
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: felinid appearance
  components:
  # - type: Sprite
  #   noRot: true
  #   drawdepth: Mobs
  #   scale: 0.8, 0.8
  # - type: ScaleVisuals
  #   scale: 0.8, 0.8
  - type: HumanoidProfile
    species: Felinid
  - type: InitialBody
    organs:
      Torso: OrganFelinidTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganFelinidStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys

- type: entity
  save: false
  name: Urisst' Mzhand Felinid
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinid
  components:
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.9
    damageRecovery:
      types:
        Asphyxiation: -1.9
  # - type: Vocal                                             idk...
  #   wilhelm: "/Audio/ADT/Felinid/cat_wilhelm.ogg"
  #   sounds:
  #     Male: MaleFelinid
  #     Female: FemaleFelinid
  #     Unsexed: MaleFelinid
  - type: Destructible #процесс разрушения на органы
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt #при каком дамаге это происходит
        damage: 350
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.6
    baseSprintSpeed : 4.6
  - type: SlowOnDamage
    speedModifierThresholds:
      48: 0.85
      64: 0.65
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 170
  # - type: Damageable # Later
  #   damageModifierSet: Felinid
  - type: Injurable
    damageContainer: Biological
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 0.9
        Slash: 4
  - type: Speech
    speechSounds: Alto
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 0.9
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Butcherable
    spawned:
      - id: FoodMeat
      - id: ClothingHeadHatCatEars
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others

- type: entity
  parent: OrganHumanTorso
  id: OrganFelinidTorso
  suffix: felinid
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Felinid

- type: entity
  parent: OrganHumanStomach
  id: OrganFelinidStomach
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
    isSpecialDigestibleExclusive: false