    sprintModifier: 0.95 #SN
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8 #SN
        Slash: 0.8 #SN
        Piercing: 0.9 #SN
        Heat: 0.8 #SN
        Cold: 0.8 #SN
        Radiation: 0.3 #SN
  - type: HeldSpeedModifier
  - type: Item #SN
    size: Normal
