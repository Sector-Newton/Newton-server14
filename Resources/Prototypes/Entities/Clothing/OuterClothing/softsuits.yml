#Basic EVA
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVA
  name: EVA suit
  description: A lightweight space suit with the basic ability to protect the wearer from the vacuum of space.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95 #SN
        Slash: 0.95 #SN
        Piercing: 0.95 #SN
        Heat: 0.95 #SN
        Cold: 0.8 #SN
        Radiation: 0.3 #SN
  - type: Item #SN
    size: Normal
    shape:
    - 0,0,2,3 #SN

#Syndicate EVA
- type: entity
  parent: [ ClothingOuterEVASuitBase, BaseSyndicateContraband ]
  id: ClothingOuterEVASuitSyndicate
  name: syndicate EVA suit
  description: "Has a tag on the back that reads: 'Totally not property of an enemy corporation, honest!'"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
  - type: StaticPrice
    price: 1000 # Helmet is 500
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7 #SN
        Slash: 0.7 #SN
        Piercing: 0.7 #SN
        Heat: 0.7 #SN
        Cold: 0.8 #SN
        Radiation: 0.3 #SN
  - type: Item #SN
    size: Normal
    shape:
    - 0,0,2,2 #SN


#Emergency EVA
- type: entity
  parent: ClothingOuterEVASuitBaseToggleable
  id: ClothingOuterSuitEmergency
  name: emergency pressure suit
  description: This bulky, uninsulated pressure suit was clearly not meant for extended use in outer space, despite NanoTrasen's claims that it passes corporate regulations.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.75
    coolingCoefficient: 0.5
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetEVALarge
  - type: Tag
    tags:
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95 #SN
        Slash: 0.95 #SN
        Piercing: 0.95 #SN
        Heat: 0.95 #SN
        Cold: 0.9 #SN
        Radiation: 0.6 #SN
  - type: Item #SN
    size: Normal
    shape:
    - 0,0,3,3 #SN

